name: Publish

on:
  workflow_dispatch:
  push:
    branches: [ '**/main' ]
    paths: [ '**/src/**' ]

permissions:
  contents: read

jobs:
  publish-mod:
    uses: ApexStudios-Dev/.github/.github/workflows/_publish-mod.yml@master
    secrets: inherit
    with:
      java-version: 25
      java-vendor: temurin
      publish-task: ':publishReleasePublicationToApexStudios-ReleasesRepository'
      curseforge-id: '416161'
      modrinth-id: 'XDyegkJL'
      artifact-id: itemresistance
      display-name: ItemResistance
      release-type: release
      logo-url: 'https://raw.githubusercontent.com/ApexStudios-Dev/.github/refs/heads/master/assets/minecraft/itemresistance/banner.png'
      color: 0xB50E0E
      use-self-runner: false
